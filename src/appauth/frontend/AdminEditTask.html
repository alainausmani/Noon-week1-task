<!DOCTYPE html>
<html>
<head>
  <title>Edit Task (Admin)</title>
  <style>
    body {
      font-family: Arial;
      background-color: #f9f9f9;
      padding: 30px;
    }
    h2 {
      text-align: center;
    }
    form {
      max-width: 600px;
      margin: auto;
      background: white;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }
    label {
      display: block;
      margin-top: 15px;
    }
    input, textarea, select {
      width: 100%;
      padding: 10px;
      margin-top: 5px;
    }
    button {
      margin-top: 20px;
      padding: 10px 15px;
      background-color: #007bff;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #0056b3;
    }
  </style>
</head>
<body>

  <h2>Edit Task (Admin)</h2>
  <form id="edit-task-form">
    <label for="title">Title</label>
    <input type="text" id="title" name="title" required>

    <label for="description">Description</label>
    <textarea id="description" name="description" required></textarea>

    <label for="status">Status</label>
<select id="status" name="status" required>
  <option value="pending">Pending</option>
  <option value="in_progress">In Progress</option>
  <option value="done">Done</option>
</select>


    <button type="submit">Update Task</button>
  </form>

  <script>
    const token = localStorage.getItem("token");

    if (!token) {
      alert("Please login first");
      window.location.href = "login.html";
    }

    // Validate token role
    try {
      const payload = JSON.parse(atob(token.split('.')[1]));
      if (payload.role !== "admin") {
        alert("Access denied. Admins only.");
        window.location.href = "login.html";
      }
    } catch (e) {
      alert("Invalid token.");
      localStorage.removeItem("token");
      window.location.href = "login.html";
    }

    const urlParams = new URLSearchParams(window.location.search);
    const taskId = urlParams.get("id");

    if (!taskId) {
      alert("No task ID provided");
      window.location.href = "adminDashboard.html";
    }

    // Load task data to populate form
    async function loadTask() {
      try {
        const res = await fetch(`http://127.0.0.1:8000/auth/admin/tasks/${taskId}`, {
          headers: {
            "Authorization": `Bearer ${token}`
          }
        });

        const task = await res.json();

        if (!res.ok) {
        alert("Update failed: " + JSON.stringify(result));
          return;
        }

        document.getElementById("title").value = task.title;
        document.getElementById("description").value = task.description;
        document.getElementById("status").value = task.status;

      } catch (err) {
        console.error("Error loading task:", err);
        alert("Failed to load task");
      }
    }

    document.getElementById("edit-task-form").addEventListener("submit", async function (e) {
      e.preventDefault();

      const updatedTask = {
        title: document.getElementById("title").value,
        description: document.getElementById("description").value,
        status: document.getElementById("status").value,
      };

      try {
        const res = await fetch(`http://127.0.0.1:8000/auth/admin/tasks/${taskId}`, {
          method: "PUT",
          headers: {
            "Authorization": `Bearer ${token}`,
            "Content-Type": "application/json"
          },
          body: JSON.stringify(updatedTask)
        });

        const result = await res.json();

        if (res.ok) {
          alert("Task updated successfully!");
          window.location.href = "adminDashboard.html";
        } else {
          alert("Update failed: " + (result.detail || "Unknown error"));
        }

      } catch (err) {
        console.error("Update error:", err);
        alert("Failed to update task.");
      }
    });

    loadTask();
    
  </script>
</body>
</html>
