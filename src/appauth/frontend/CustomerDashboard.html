<!DOCTYPE html>
<html>
<head>
  <title>Task Dashboard</title>
  <style>
    body { font-family: Arial; background: #f9f9f9; padding: 20px; }
    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 10px; border: 1px solid #ccc; text-align: left; }
    th { background-color: #eee; }
    button { margin-right: 10px; }
  </style>
</head>
<body>
  <h2>Task Dashboard</h2>
  <button onclick="window.location.href='CreateTask.html'">Add Task</button>
  <table id="task-table">
    <thead>
      <tr>
        <th>Title</th><th>Description</th><th>Status</th><th>Created At</th><th>Actions</th>
      </tr>
    </thead>
    <tbody></tbody>
  </table>

  <script>
    const token = localStorage.getItem("token");
    if (!token) {
      alert("Please login first");
      window.location.href = "login.html";
    }

    async function fetchTasks() {
      const response = await fetch("http://127.0.0.1:8000/auth/tasks", {
        headers: { "Authorization": `Bearer ${token}` }
      });
      const tasks = await response.json();
      const tbody = document.querySelector("#task-table tbody");
      tbody.innerHTML = "";

      tasks.forEach(task => {
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${task.title}</td>
          <td>${task.description}</td>
          <td>${task.status}</td>
          <td>${new Date(task.created_at).toLocaleString()}</td>
          <td>
            <button onclick="editTask(${task.id})">Edit</button>
            <button onclick="deleteTask(${task.id})">Delete</button>
          </td>
        `;
        tbody.appendChild(row);
      });
    }

    async function deleteTask(taskId) {
      if (!confirm("Are you sure you want to delete this task?")) return;
      const response = await fetch(`http://127.0.0.1:8000/auth/tasks/${taskId}`, {
        method: "DELETE",
        headers: { "Authorization": `Bearer ${token}` }
      });
      if (response.ok) fetchTasks();
      else alert("Delete failed");
    }

    function editTask(id) {
      window.location.href = `edittask.html?id=${id}`;
    }

    fetchTasks();
  </script>
</body>
</html>
